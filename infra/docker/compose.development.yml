# Non-production demo only. This local Developer-edition service does not define or approve a production SQL Server edition or topology.
name: student-registration-development

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SRS_SQL_SA_PASSWORD:?Set SRS_SQL_SA_PASSWORD outside Git}"
      SQLCMDPASSWORD: "${SRS_SQL_SA_PASSWORD:?Set SRS_SQL_SA_PASSWORD outside Git}"
    ports:
      - "${SRS_SQL_PORT:-1433}:1433"
    volumes:
      - development-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  development-sql-data:
