<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="brand/aastmt-logo.png" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="css/design-tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="StudentRegistration.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="startup-progress"
             role="progressbar"
             aria-label="Loading Student Registration"></div>
        <section class="startup-recovery"
                 data-startup-recovery
                 role="status"
                 aria-live="polite"
                 aria-labelledby="startup-recovery-heading">
            <h1 id="startup-recovery-heading">Starting Student Registration</h1>
            <p>If the application does not start, check your connection and retry.</p>
            <a href="/">Retry loading</a>
        </section>
    </div>
    <div id="blazor-error-ui" role="alert"></div>
    <script src="js/skip-link-focus.js"></script>
    <script src="js/identity-antiforgery.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
